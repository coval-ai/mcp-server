name: Deploy remote MCP
run-name: Deploy remote MCP - ${{ github.event.client_payload.environment }} - ${{ github.event.client_payload.release_correlation_id }}

on:
  repository_dispatch:
    types: [coval_mcp_release]

permissions:
  contents: read
  id-token: write

concurrency:
  group: mcp-${{ github.event.client_payload.environment }}-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.client_payload.environment == 'v1' && 'production' || 'staging' }}
    env:
      AWS_REGION: us-east-2
      MCP_ENVIRONMENT: ${{ github.event.client_payload.environment }}
    steps:
      - name: Validate release dispatch
        env:
          DEPLOY_REF: ${{ github.event.client_payload.deploy_ref }}
          RELEASE_CORRELATION_ID: ${{ github.event.client_payload.release_correlation_id }}
        run: |
          set -euo pipefail
          case "$MCP_ENVIRONMENT" in
            staging|v1) ;;
            *)
              echo "::error::Unsupported MCP environment."
              exit 1
              ;;
          esac
          if [ -z "$DEPLOY_REF" ] || [ -z "$RELEASE_CORRELATION_ID" ]; then
            echo "::error::Release deploy ref and correlation id are required."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.deploy_ref }}
          persist-credentials: false
      - name: Resolve deployed source
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::851725437270:role/sofia-${{ env.MCP_ENVIRONMENT }}-mcp-github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push immutable and current tags
        env:
          IMAGE_TAG: ${{ steps.source.outputs.sha }}
          REPOSITORY: sofia-${{ env.MCP_ENVIRONMENT }}-mcp
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          image="${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com/${REPOSITORY}"
          docker build -t "${image}:${IMAGE_TAG}" -t "${image}:latest" .
          docker push "${image}:${IMAGE_TAG}"
          docker push "${image}:latest"
      - name: Roll MCP service
        run: |
          set -euo pipefail
          aws ecs update-service \
            --cluster "sofia-${MCP_ENVIRONMENT}-cluster" \
            --service "sofia-${MCP_ENVIRONMENT}-mcp" \
            --force-new-deployment >/dev/null
          aws ecs wait services-stable \
            --cluster "sofia-${MCP_ENVIRONMENT}-cluster" \
            --services "sofia-${MCP_ENVIRONMENT}-mcp"
