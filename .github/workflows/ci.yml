name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --runInBand
      - run: npm run build
      - name: Build production image
        run: |
          docker build \
            --build-arg "COVAL_MCP_SOURCE_SHA=${GITHUB_SHA}" \
            --build-arg "COVAL_MCP_ENV=ci" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "coval-mcp:${GITHUB_SHA}" \
            .
      - name: Qualify production image
        env:
          COVAL_MCP_IMAGE: coval-mcp:${{ github.sha }}
          COVAL_MCP_SOURCE_SHA: ${{ github.sha }}
        run: npm run qualify:image
