# Reviewed against the live public OpenAPI catalog by scripts/audit_api_coverage.py.
# Every published operation must either be reachable from an MCP tool or have a reason here,
# and every published request-body property on a covered operation must either be declared on
# the body src/client.ts sends or have a reason in the request-field sections below.
#
# The MCP server exposes a curated tool set, not the whole API, so most operations are reviewed
# gaps. The weekly parity PR flags what the API adds or changes so each one gets a decision.

[snapshot]
catalog_url = "https://api.coval.dev/v1/openapi"
reviewed_at = "2026-10-05"
published_operations = 183
mcp_supported_operations = 29
published_request_fields = 86
mcp_modeled_request_fields = 57

